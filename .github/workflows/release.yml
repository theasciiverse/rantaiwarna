# Builds rantaiwarna for the Asciiverse catalog: one archive per target,
# rantaiwarna-<target>.tar.gz, plus SHA256SUMS, attached to a GitHub
# release (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a
# pushed tag, or by hand for an existing tag.
#
# Linux builds run in Alpine and link ncurses statically, giving the
# -musl triple av looks for first. macOS links the system ncurses, with
# _DARWIN_C_SOURCE so SIGWINCH stays visible beside _XOPEN_SOURCE. No
# Windows build: the game is built on POSIX signals, a self-pipe and
# getpwuid().

name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            LDFLAGS="-static -s" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/rantaiwarna

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          LIBS=-lncurses CFLAGS="-O2 -arch ${{ matrix.arch }} -D_DARWIN_C_SOURCE" \
            LDFLAGS="-arch ${{ matrix.arch }}" asciiverse/build.sh
          strip out/rantaiwarna
          file out/rantaiwarna
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "rantaiwarna $TAG" \
                 --notes "rantaiwarna $TAG, Guido Berhoerster's SameGame for the terminal, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
